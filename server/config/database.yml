# PostgreSQL. Versions 9.3 and up are supported.
#
# Install the pg driver:
#   gem install pg
# On macOS with Homebrew:
#   gem install pg -- --with-pg-config=/usr/local/bin/pg_config
# On Windows:
#   gem install pg
#       Choose the win32 build.
#       Install PostgreSQL and put its /bin directory on your path.
#
# Configure Using Gemfile
# gem "pg"
#
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch('RAILS_MAX_THREADS') { 5 } %>
  host: <%= ENV.fetch('DB_HOST', 'db') %>
  username: <%= ENV.fetch('DB_USERNAME', 'postgres') %>
  password: <%= ENV.fetch('DB_PASSWORD', 'postgres') %>
development:
  primary:
    <<: *default
    database: server_development
  queue:
    <<: *default
    database: server_development_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: server_development_cable
    migrations_paths: db/cable_migrate
test:
  <<: *default
  database: server_test
production:
  primary:
    <<: *default
    database: server_production
  cache:
    <<: *default
    database: server_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: server_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: server_production_cable
    migrations_paths: db/cable_migrate
